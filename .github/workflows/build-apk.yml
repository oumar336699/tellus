name: Build Android APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Grant execute permission for gradlew
      run: |
        cd frontend
        chmod +x android/gradlew || true
    
    - name: Add Android platform to Capacitor
      run: |
        cd frontend
        npx cap add android || echo "Android platform already exists"
    
    - name: Sync Capacitor
      run: |
        cd frontend
        npx cap sync android
    
    - name: Build Android APK
      run: |
        cd frontend/android
        ./gradlew assembleDebug --stacktrace || true
    
    - name: Check if APK was built
      run: |
        if [ -f "frontend/android/app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "APK built successfully"
        else
          echo "APK build failed, checking for alternative paths"
          find frontend/android -name "*.apk" -type f || echo "No APK files found"
        fi
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: tellus-apk
        path: |
          frontend/android/app/build/outputs/apk/debug/app-debug.apk
          frontend/android/app/build/outputs/apk/**/*.apk
        retention-days: 30
        if-no-files-found: warn
    
    - name: Release APK
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
